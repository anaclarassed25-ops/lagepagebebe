<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feliz Aniversário</title>

<style>

:root{
    --primary-black: #e0c1da;
    --secondary-black: #523333;
    --accent-red: #f3d3db;
}

.loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--primary-black), var(--secondary-black));
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
}

.loading-heart {
    font-size: 4rem;
    animation: loading-pulse 1s ease-in-out infinite;
    color: var(--accent-pink);
    filter: drop-shadow(0 0 20px var(--accent-pink));
}

.loading-content{
    text-align: center;
}

.loading-gif{
    width: 450px;
    display: block;
    margin: 0 auto;
}

.loading-text{
    margin-top: 15px;
    font-size: 20px;
}


@keyframes loading-pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}

body{
    background-color: rgb(238, 128, 128);
    text-align:center;
    font-family: Arial;
}

.painel{
    margin: auto;
    margin-top: 50px;
    background-color: white;
    width: 500px;
    padding: 40px;
    border-radius: 30px;
}

#sim{
    height: 40px;
    width: 60px;
    background-color: green;
    color:white;
    border:none;
    border-radius:10px;
}

#nao{
    position:absolute;
    height:40px;
    width:60px;
    background-color:rgb(219, 42, 51);
    color:white;
    border:none;
    border-radius:10px;
}
</style>

</head>
<body>

    <body>

<div class="loading-overlay">
    <img src="https://upload-os-bbs.hoyolab.com/upload/2025/12/10/163732817/8d66fc14f224dd81e40ab4affe2e18cf_7552860584616259195.gif" 
         alt="Loading" 
         width="450">
        
</div>


</div>


    
<div class="painel">
    <h1>FELIZ ANIVERSÁRIO 🎉🎉🎉🎉🎉🎉🎉🎉🎉🎉💕</h1>

    <img src="https://media.tenor.com/V72nfGYRV1kAAAAM/venrina-furina.gif">

    <h2>Quer ver o que eu preparei pra você?</h2>

    <a href="http://127.0.0.1:3000/cartinha.html?serverWindowId=e6107b2a-c647-45e3-bbdd-f5b46616816c">
        <button id="sim">Sim</button>
    </a>

    <button id="nao" onmouseover="fuja()">Não</button>
</div>

<script>

window.addEventListener("load", function(){
    const overlay = document.querySelector(".loading-overlay");
    overlay.style.opacity = "0";
    overlay.style.transition = "opacity 1s ease";

    setTimeout(() => {
        overlay.style.display = "none";
    }, 10000);
});


function fuja(){
    var botao = document.getElementById("nao");
    botao.style.left = Math.random() * window.innerWidth + "px";
    botao.style.top = Math.random() * window.innerHeight + "px";
}

const mensagens = [
    " Te amo",
    "Cada day contigo é veri bobigudi",
    "eu sou a buce e vc a tinha💕💕",
    " deu trabalho pra vc isso te amo",
    "affs eu já falei que teamo",
    "FELIZ ANIVERSARIO TE AMO!",
    "Estrela de hoje é vc clarinho que sim",
    "Amor da minha life todinha",
];

function mostrarMensagem(){
    const div = document.createElement("div");

    div.innerText = mensagens[Math.floor(Math.random() * mensagens.length)];

    div.style.position = "fixed";
    div.style.top = "20px";
    div.style.right = "20px";
    div.style.background = "#ff0040";
    div.style.color = "white";
    div.style.padding = "15px 25px";
    div.style.borderRadius = "20px";
    div.style.fontWeight = "bold";
    div.style.boxShadow = "0 5px 20px rgba(0,0,0,0.3)";
    div.style.zIndex = "9999";

    document.body.appendChild(div);

    setTimeout(() => {
        div.remove();
    }, 4000);
}

// mostra a cada 5 segundos
setInterval(mostrarMensagem, 5000);

document.addEventListener('DOMContentLoaded', () => {
            // Observar elementos para animação
            const elements = document.querySelectorAll('.photo-frame, .special-message');
            elements.forEach(el => observer.observe(el));
            
            // Criar partículas iniciais
            for (let i = 0; i < 15; i++) {
                setTimeout(() => createParticle(), i * 300);
            }
            
            // Primeira notificação
            setTimeout(showNotification, 5000);
            
            // Efeito de entrada suave
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 1s ease';
                document.body.style.opacity = '1';
            }, 100);
        });

    

</script>


</body>
</html>
